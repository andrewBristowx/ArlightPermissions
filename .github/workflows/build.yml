name: Importar fuente y compilar

on:
  workflow_dispatch:
  pull_request:
  push:
    paths: ['.github/workflows/build.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Descargar e importar ArlightPermissions 1.0.3
        shell: bash
        run: |
          set -euo pipefail
          FILE_ID='1uT_WcW4MJfFhjzGnyCh6culsdNNKZNaC'
          curl -L --fail --retry 3 "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" -o /tmp/source.zip
          unzip -t /tmp/source.zip
          rm -rf /tmp/source-extracted && mkdir -p /tmp/source-extracted
          unzip -q /tmp/source.zip -d /tmp/source-extracted
          ROOT_FILE="$(find /tmp/source-extracted -maxdepth 6 -type f \( -name pom.xml -o -name gradlew -o -name build.gradle -o -name build.gradle.kts \) | head -n 1)"
          test -n "$ROOT_FILE"
          ROOT="$(dirname "$ROOT_FILE")"
          rsync -a --delete --exclude '.git/' --exclude '.github/' "$ROOT/" ./
          printf '%s\n' 'ArlightPermissions 1.0.3 BIDIRECTIONAL-CHANNEL-FIX' > SOURCE_VERSION.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Importar ArlightPermissions 1.0.3'
            BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push origin "HEAD:${BRANCH}"
          fi
      - name: Compilar
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pom.xml ]; then mvn -B -U clean package; elif [ -f gradlew ]; then chmod +x gradlew && ./gradlew --no-daemon clean build; else exit 1; fi
      - name: Reunir JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          [ ! -d target ] || find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} dist/ \;
          [ ! -d build/libs ] || find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: ArlightPermissions-1.0.3-JAR
          path: dist/*.jar
          if-no-files-found: error
